<!doctype html>
<html lang="fr" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Place - Espace Personnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    function getTheme() {
      return localStorage.getItem('theme') || 'dark'
    }
    function applyTheme(theme) {
      document.documentElement.classList.toggle('dark', theme === 'dark')
      document.documentElement.classList.toggle('light', theme === 'light')
      localStorage.setItem('theme', theme)
    }
    applyTheme(getTheme())

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: 'var(--color-bg)',
            surface: 'var(--color-surface)',
            border: 'var(--color-border)',
            text: 'var(--color-text)',
            muted: 'var(--color-muted)',
            accent: '#00d1ff',
            accentSec: '#f87171',
            success: '#34d399',
            warning: '#fbbf24',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --color-bg: #f8fafc;
      --color-surface: #ffffff;
      --color-border: #e2e8f0;
      --color-text: #0f172a;
      --color-muted: #64748b;
      --scrollbar-track: #f1f5f9;
      --scrollbar-thumb: #cbd5e1;
      --scrollbar-hover: #94a3b8;
      --checkbox-bg: #f1f5f9;
      --checkbox-border: #cbd5e1;
    }
    .dark {
      --color-bg: #0b0f14;
      --color-surface: #111820;
      --color-border: #1e293b;
      --color-text: #e6eef6;
      --color-muted: #64748b;
      --scrollbar-track: #0b0f14;
      --scrollbar-thumb: #1e293b;
      --scrollbar-hover: #334155;
      --checkbox-bg: #0f1720;
      --checkbox-border: #2d3748;
    }
    body { background-color: var(--color-bg); color: var(--color-text); -webkit-font-smoothing: antialiased; }
    .tracking-tighter-custom { letter-spacing: -0.04em; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
    .hero-glow { background: radial-gradient(circle at 50% 0%, rgba(0, 209, 255, 0.08) 0%, rgba(11, 15, 20, 0) 60%); }
    .card-hover:hover { border-color: rgba(0, 209, 255, 0.3); transform: translateY(-1px); }
    input[type="checkbox"] { accent-color: #00d1ff; background-color: var(--checkbox-bg); border-color: var(--checkbox-border); }
    .gradient-text { background: linear-gradient(135deg, #00d1ff 0%, #34d399 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    .animate-slide-in { animation: slideIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

    #google-signin-btn { width: 100%; }
    #google-signin-btn iframe { width: 100% !important; height: 44px !important; border-radius: 0.5rem !important; }
    div[role="button"] { border-radius: 0.5rem !important; }
  </style>
</head>
<body class="bg-bg text-text antialiased selection:bg-accent selection:text-bg flex flex-col min-h-screen">

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
