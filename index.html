<!doctype html>
<html lang="fr" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Place - Espace Personnel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    function getTheme() {
      return localStorage.getItem('theme') || 'dark'
    }
    function applyTheme(theme) {
      document.documentElement.classList.toggle('dark', theme === 'dark')
      document.documentElement.classList.toggle('light', theme === 'light')
      localStorage.setItem('theme', theme)
    }
    applyTheme(getTheme())

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: 'var(--color-bg)',
            surface: 'var(--color-surface)',
            border: 'var(--color-border)',
            text: 'var(--color-text)',
            muted: 'var(--color-muted)',
            accent: '#DC2626',
            accentSec: '#7F1D1D',
            success: '#E5E5E5',
            warning: '#A3A3A3',
          },
          fontFamily: {
            display: ['Outfit', 'system-ui', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --color-bg: #FAFAFA;
      --color-surface: rgba(0, 0, 0, 0.02);
      --color-surface-solid: #FFFFFF;
      --color-border: #E5E5E5;
      --color-text: #0A0A0A;
      --color-muted: #737373;
      --scrollbar-track: #FAFAFA;
      --scrollbar-thumb: #D4D4D4;
      --scrollbar-hover: #A3A3A3;
      --glass-bg: rgba(255, 255, 255, 0.8);
      --glass-border: rgba(0, 0, 0, 0.06);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
    }
    .dark {
      --color-bg: #0A0A0A;
      --color-surface: rgba(255, 255, 255, 0.03);
      --color-surface-solid: #141414;
      --color-border: #262626;
      --color-text: #F5F5F5;
      --color-muted: #525252;
      --scrollbar-track: #0A0A0A;
      --scrollbar-thumb: #1F1F1F;
      --scrollbar-hover: #333333;
      --glass-bg: rgba(10, 10, 10, 0.7);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    body { background-color: var(--color-bg); color: var(--color-text); -webkit-font-smoothing: antialiased; }
    .tracking-tighter-custom { letter-spacing: -0.04em; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }
    .glass-strong {
      background: var(--glass-bg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
    }

    .hero-glow {
      background: radial-gradient(ellipse at 50% 0%, rgba(220, 38, 38, 0.12) 0%, rgba(10, 10, 10, 0) 60%);
    }
    .dark .hero-glow {
      background: radial-gradient(ellipse at 50% 0%, rgba(220, 38, 38, 0.08) 0%, rgba(10, 10, 10, 0) 60%);
    }
    .hero-glow-light {
      background: radial-gradient(ellipse at 50% 0%, rgba(220, 38, 38, 0.1) 0%, rgba(250, 250, 250, 0) 60%);
    }

    .card-glow:hover {
      box-shadow: 0 0 0 1px rgba(220, 38, 38, 0.2), 0 8px 40px -12px rgba(220, 38, 38, 0.15);
    }
    .dark .card-glow:hover {
      box-shadow: 0 0 0 1px rgba(220, 38, 38, 0.15), 0 8px 40px -12px rgba(220, 38, 38, 0.1);
    }

    input[type="checkbox"] { accent-color: #DC2626; }
    .gradient-text {
      background: linear-gradient(135deg, #DC2626 0%, #7F1D1D 50%, #F5F5F5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gradient-border {
      position: relative;
    }

    .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
    .animate-slide-in { animation: slideIn 0.4s ease-out forwards; }
    .animate-glow-pulse { animation: glowPulse 3s ease-in-out infinite; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes glowPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    .noise {
      position: relative;
    }

    #google-signin-btn { width: 100%; }
    #google-signin-btn iframe { width: 100% !important; height: 44px !important; border-radius: 0.75rem !important; }
    div[role="button"] { border-radius: 0.75rem !important; }
  </style>
</head>
<body class="bg-bg text-text antialiased selection:bg-accent selection:text-bg flex flex-col min-h-screen">

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
